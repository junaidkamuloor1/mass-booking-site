<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tickets</title>
    <link rel="stylesheet" href="tickets.css">
</head>
<body>

<header class="site-header">
    <div class="container">
        <nav class="header">

            <a href="#" class="logo">MASS</a>

            <div class="menu">
                <a href="index.html#now-showing" class="menu-link">FILMS</a>
                <a href="showtimes.html" class="menu-link">SHOWTIMES</a>
                <a href="#" class="menu-link active">TICKETS</a>
            </div>

            <a href="#" class="sign-in">SIGN IN</a>

        </nav>
    </div>
</header>

<div class="page-head">
    <span class="section-label">YOUR BOOKINGS</span>
    <h1>your tickets.</h1>
    <button id="clearAllBtn" class="clear-all-link" onclick="removeAllTickets()">CANCEL ALL</button>
</div>

<section class="tickets-section">
    <div class="ticket-list" id="ticketList"></div>
</section>

<div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-box">
        <span class="section-label">HEADS UP</span>
        <h3>Cancel all tickets?</h3>
        <p>This will remove all your bookings. This can't be undone.</p>
        <div class="confirm-actions">
            <button class="confirm-cancel" onclick="closeConfirm()">KEEP THEM</button>
            <button class="confirm-delete" onclick="confirmDeleteAll()">CANCEL ALL</button>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">

        <div class="footer-main">
            <div class="footer-brand">
                <span>MASS</span>
                <p>Films make your life better.</p>
            </div>

            <div class="footer-nav">
                <a href="index.html#now-showing">FILMS</a>
                <a href="showtimes.html">SHOWTIMES</a>
                <a href="tickets.html">TICKETS</a>
            </div>
        </div>

        <div class="footer-line"></div>

        <div class="footer-bottom">
            <span>© 2026 MASS</span>
            <span>MADE FOR THE LOVE OF CINEMA</span>
        </div>

    </div>
</footer>

<script>
const TICKETS_KEY = 'mass_tickets';

function getTickets() {
    try {
        return JSON.parse(localStorage.getItem(TICKETS_KEY)) || [];
    } catch (e) {
        return [];
    }
}

function removeTicket(id) {
    const tickets = getTickets().filter(t => t.id !== id);
    localStorage.setItem(TICKETS_KEY, JSON.stringify(tickets));
    render();
}

function barcode() {
    return Array.from({ length: 26 })
        .map(() => `<span style="height:${8 + Math.round(Math.random() * 20)}px"></span>`)
        .join('');
}

function render() {
    const list = document.getElementById('ticketList');
    const tickets = getTickets();
    const clearAllBtn = document.getElementById('clearAllBtn'); // give your button this id

    clearAllBtn.style.display = tickets.length < 2 ? 'none' : '';

    if (tickets.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <span class="section-label">NOTHING BOOKED YET</span>
                <h2>your seat's still empty.</h2>
                <a href="showtimes.html">BROWSE SHOWTIMES &rarr;</a>
            </div>
        `;
        return;
    }

    list.innerHTML = tickets.map(t => `
        <article class="ticket-card">
            <img class="ticket-poster" src="${t.poster}" alt="${t.movieTitle}">

            <div class="ticket-main">
                <div class="ticket-top">
                    <div>
                        <h3>${t.movieTitle}</h3>
                        <p class="ticket-sub">${t.theatreName}</p>
                    </div>
                    <span class="format-label">${t.format}</span>
                </div>

                <div class="ticket-info-row">
                    <span>${t.dateLabel}</span>
                    <span>${t.time}</span>
                    <span>${t.theatreLocation}</span>
                </div>

                <div class="seat-chips">
                    ${t.seats.map(s => `<span class="seat-chip">${s}</span>`).join('')}
                </div>
            </div>

            <div class="ticket-stub">
                <div class="barcode">${barcode()}</div>
                <span class="ticket-id">${t.id}</span>
                <button class="cancel-link" onclick="removeTicket('${t.id}')">CANCEL</button>
            </div>
        </article>
    `).join('');
}

function removeAllTickets() {
    document.getElementById('confirmOverlay').classList.add('active');
}

function closeConfirm() {
    document.getElementById('confirmOverlay').classList.remove('active');
}

function confirmDeleteAll() {
    localStorage.setItem(TICKETS_KEY, JSON.stringify([]));
    closeConfirm();
    render();
}

render();
</script>

</body>
</html>
